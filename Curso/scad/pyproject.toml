[project]
name = "scad"
version = "1.0.0"
description = "Sistema Centralizado de Avisos de Dominio"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn>=0.53.0",
    "sqlmodel>=0.0.24",
    "jinja2>=3.1.6",
    "markdown>=3.8",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = "."
addopts = "--import-mode=importlib"
